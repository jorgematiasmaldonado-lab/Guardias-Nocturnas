<script>
'use strict';
/* =====================================================================
   NÚCLEO: fechas, personal, ausencias, estadísticas y reparto equitativo
   (sin acceso al DOM: se puede probar por separado)
   ===================================================================== */
const APP_ID = 'nocturnas-guardiaA';
const APP_VERSION = 1;
const MESES = ['ENERO','FEBRERO','MARZO','ABRIL','MAYO','JUNIO','JULIO','AGOSTO','SEPTIEMBRE','OCTUBRE','NOVIEMBRE','DICIEMBRE'];
const DAY_MS = 86400000;
const pad2 = n => String(n).padStart(2, '0');

const F = {
  parse(s) { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d); },
  iso(t) { return new Date(t).toISOString().slice(0, 10); },
  add(s, n) { return F.iso(F.parse(s) + n * DAY_MS); },
  diff(a, b) { return Math.round((F.parse(b) - F.parse(a)) / DAY_MS); },
  fmt(s) { if (!s) return ''; const [y, m, d] = s.split('-'); return `${d}/${m}/${y}`; },
  corto(s) { const [y, m, d] = s.split('-'); return `${+d}/${+m}/${y.slice(2)}`; },
  fromDMY(s) {
    const m = String(s || '').trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    return m ? `${m[3]}-${pad2(m[2])}-${pad2(m[1])}` : null;
  },
  today() { const d = new Date(); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; },
  mk(s) { return s.slice(0, 7); },
  mkLabel(mk) { const [y, m] = mk.split('-'); return `${MESES[+m - 1]} ${y}`; },
  mesNombre(mk) { return MESES[+mk.split('-')[1] - 1]; },
  nextMk(mk) { let [y, m] = mk.split('-').map(Number); m++; if (m > 12) { m = 1; y++; } return `${y}-${pad2(m)}`; },
  prevMk(mk) { let [y, m] = mk.split('-').map(Number); m--; if (m < 1) { m = 12; y--; } return `${y}-${pad2(m)}`; },
  nowStamp() { const d = new Date(); return `${F.today()} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`; },
};

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase().replace(/\s+/g, ' ').trim();

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* ---------------- Configuración y estado ---------------- */
function defaultConfig() {
  return {
    base: 'Base Punilla',
    guardia: 'A',
    refDate: '2026-10-03',
    ciclo: 3,
    franjas: [
      { label: '22:00 a 00:00', horas: 2 },
      { label: '00:00 a 03:30', horas: 3.5 },
      { label: '03:30 a 07:00hs', horas: 3.5 },
    ],
    regla: 'proporcional', // o 'recupera'
    semilla: 2026,
    fechasExtra: [],
    fechasQuitadas: [],
    ultimoRespaldo: null,
    quien: '',
  };
}

function emptyState() {
  return { app: APP_ID, version: APP_VERSION, config: defaultConfig(), personal: [], ausencias: [], meses: {}, auditoria: [] };
}

function hoursOf(state, fi) { const f = state.config.franjas[fi]; return f ? (+f.horas || 0) : 0; }
function franjaLabel(state, fi) { const f = state.config.franjas[fi]; return f ? f.label : `Franja ${fi + 1}`; }

/* ---------------- Personal ---------------- */
function personById(state, id) { return state.personal.find(p => p.id === id) || null; }

function shortName(state, p) {
  if (!p) return '—';
  if (p.cortoManual) return p.cortoManual;
  const ap = norm(p.apellido);
  const dup = state.personal.filter(q => norm(q.apellido) === ap).length > 1;
  return dup ? `${ap} ${norm(p.nombre).charAt(0)}` : ap;
}
function shortById(state, id) { return shortName(state, personById(state, id)); }
function fullName(p) { return p ? `${norm(p.apellido)} ${norm(p.nombre)}`.trim() : '—'; }

function activeOn(p, date) {
  return (!p.alta || p.alta <= date) && (!p.baja || date < p.baja.fecha);
}
function absenceOn(state, pid, date) {
  return state.ausencias.find(a => a.pid === pid && a.inicio <= date && (a.fin == null || date <= a.fin)) || null;
}
function available(state, p, date) {
  return activeOn(p, date) && p.hace !== false && !absenceOn(state, p.id, date);
}
function medicaActiva(state, pid) {
  return state.ausencias.find(a => a.pid === pid && a.tipo === 'medica' && a.fin == null) || null;
}
function estadoPersona(state, p) {
  if (p.baja) return 'baja';
  if (medicaActiva(state, p.id)) return 'medica';
  return 'activo';
}
function elegible(p) { return !p.baja && p.hace !== false; }

const TIPOS_AUS = { anual: 'Licencia anual', medica: 'Licencia médica', otra: 'Otra ausencia' };
function ausLabel(a) { return a.tipo === 'otra' && a.motivo ? a.motivo : TIPOS_AUS[a.tipo] || a.tipo; }
function reasonUnavailable(state, p, date) {
  if (p.alta && date < p.alta) return 'Antes de su alta';
  if (p.baja && date >= p.baja.fecha) return 'Baja de la guardia';
  if (p.hace === false) return 'No hace nocturna';
  const a = absenceOn(state, p.id, date);
  if (a) return ausLabel(a);
  return null;
}

/* ---------------- Fechas de guardia ---------------- */
function guardDates(state, mk) {
  const c = state.config;
  const ciclo = Math.max(1, +c.ciclo || 3);
  const [y, m] = mk.split('-').map(Number);
  const days = new Date(Date.UTC(y, m, 0)).getUTCDate();
  const out = [];
  for (let d = 1; d <= days; d++) {
    const s = `${mk}-${pad2(d)}`;
    const df = F.diff(c.refDate, s);
    if (((df % ciclo) + ciclo) % ciclo === 0 && !c.fechasQuitadas.includes(s)) out.push(s);
  }
  for (const e of c.fechasExtra) if (F.mk(e) === mk && !out.includes(e)) out.push(e);
  return out.sort();
}

function monthDates(state, mk) {
  const set = new Set(guardDates(state, mk));
  const ex = state.meses[mk];
  if (ex) for (const d of Object.keys(ex.noches)) set.add(d);
  return [...set].sort();
}

function allNights(state) {
  const out = [];
  for (const [mk, M] of Object.entries(state.meses)) {
    for (const [date, slots] of Object.entries(M.noches)) out.push({ mk, date, slots, estado: M.estado });
  }
  return out.sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
}

/* ---------------- Estadísticas ---------------- */
function countsAsAvailable(state, p, date) {
  if (state.config.regla === 'recupera') return activeOn(p, date) && p.hace !== false;
  return available(state, p, date);
}

function newStat(nf) { return { T: 0, H: 0, F: Array(nf).fill(0), D: 0, last: null, hechos: 0, recibidos: 0 }; }

function statsFrom(state, nights) {
  const nf = Math.max(state.config.franjas.length, 3);
  const S = {};
  for (const p of state.personal) S[p.id] = newStat(nf);
  for (const n of nights) {
    const present = new Set();
    n.slots.forEach((s, i) => {
      if (!s || !s.pid || !S[s.pid]) return;
      const st = S[s.pid];
      st.T++; st.H += hoursOf(state, i); st.F[i] = (st.F[i] || 0) + 1; st.last = n.date;
      present.add(s.pid);
      if (s.cubreA) { st.hechos++; if (S[s.cubreA]) S[s.cubreA].recibidos++; }
    });
    for (const p of state.personal) if (present.has(p.id) || countsAsAvailable(state, p, n.date)) S[p.id].D++;
  }
  return S;
}
const rateOf = st => st.D > 0 ? st.T / st.D : 0;

/* Turnos realizados: mes publicado y fecha anterior a hoy */
function realizedNights(state, today, desde, hasta) {
  return allNights(state).filter(n => n.estado === 'publicado' && n.date < today &&
    (!desde || n.date >= desde) && (!hasta || n.date <= hasta));
}

/* ---------------- Planificador ---------------- */
function buildContext(state, mk) {
  const dates = monthDates(state, mk);
  const nf = state.config.franjas.length;
  const first = dates[0] || `${mk}-01`;
  const baseNights = allNights(state).filter(n => n.mk !== mk && n.date < first);
  const base = statsFrom(state, baseNights);
  const prevNight = baseNights[baseNights.length - 1];
  const prevSet = new Set(prevNight ? prevNight.slots.filter(s => s && s.pid).map(s => s.pid) : []);
  const availSet = dates.map(d => new Set(state.personal.filter(p => available(state, p, d)).map(p => p.id)));
  const countSet = dates.map(d => new Set(state.personal.filter(p => countsAsAvailable(state, p, d)).map(p => p.id)));
  const hours = state.config.franjas.map(f => +f.horas || 0);
  const ids = state.personal.map(p => p.id);
  const eligIds = new Set(state.personal.filter(elegible).map(p => p.id));
  // personas que participan del cálculo de equidad del mes: elegibles con al menos una noche disponible
  const fairIds = ids.filter(id => eligIds.has(id) && availSet.some(s => s.has(id)));
  return { state, mk, dates, nf, base, prevSet, availSet, countSet, hours, ids, fairIds };
}

function objective(ctx, grid) {
  const { base, nf, hours, dates } = ctx;
  const T = {}, D = {}, Fq = {};
  for (const id of ctx.ids) { const b = base[id]; T[id] = b.T; D[id] = b.D; Fq[id] = b.F.slice(0, nf); while (Fq[id].length < nf) Fq[id].push(0); }
  let pen = 0;
  let prev = ctx.prevSet;
  for (let di = 0; di < dates.length; di++) {
    const cur = new Set();
    const night = grid[di];
    for (let fi = 0; fi < night.length; fi++) {
      const s = night[fi];
      if (!s.pid) { pen += 1000; continue; }
      const p = s.pid;
      if (T[p] === undefined) continue;
      T[p]++; if (fi < nf) Fq[p][fi]++;
      if (cur.has(p)) pen += 500;
      if (prev.has(p)) pen += 40;
      if (!ctx.availSet[di].has(p)) pen += 2000;
      cur.add(p);
    }
    for (const id of ctx.countSet[di]) D[id]++;
    for (const id of cur) if (!ctx.countSet[di].has(id)) D[id]++;
    prev = cur;
  }
  const ids = ctx.fairIds;
  if (!ids.length) return pen;
  let mean = 0; const r = {};
  for (const id of ids) { r[id] = D[id] > 0 ? T[id] / D[id] : 0; mean += r[id]; }
  mean /= ids.length;
  let fair = 0, fr = 0;
  for (const id of ids) {
    fair += (r[id] - mean) ** 2;
    const avg = T[id] / nf;
    for (let f = 0; f < nf; f++) fr += (Fq[id][f] - avg) ** 2;
  }
  return pen + fair * 10000 + fr * 3;
}

function permutations(arr) {
  if (arr.length <= 1) return [arr.slice()];
  const out = [];
  arr.forEach((x, i) => { for (const p of permutations(arr.slice(0, i).concat(arr.slice(i + 1)))) out.push([x, ...p]); });
  return out;
}

function greedyFill(ctx, grid, fixed, rng) {
  const { base, nf, hours, dates } = ctx;
  const T = {}, D = {}, H = {}, Fq = {};
  for (const id of ctx.ids) { const b = base[id]; T[id] = b.T; D[id] = b.D; H[id] = b.H; Fq[id] = b.F.slice(0, nf); while (Fq[id].length < nf) Fq[id].push(0); }
  let prev = ctx.prevSet;
  for (let di = 0; di < dates.length; di++) {
    const night = grid[di];
    const cur = new Set(night.filter((s, fi) => fixed[di][fi] && s.pid).map(s => s.pid));
    const blocked = new Set(cur); night.forEach(s => { if (s.cubreA) blocked.add(s.cubreA); });
    for (const id of ctx.countSet[di]) D[id]++;
    for (const id of cur) if (!ctx.countSet[di].has(id)) D[id]++;
    const free = [];
    night.forEach((s, fi) => { if (!fixed[di][fi]) free.push(fi); });
    if (free.length) {
      const cands = [...ctx.availSet[di]].filter(p => !blocked.has(p)).map(p => ({
        p, key: T[p] / Math.max(D[p], 1) + (prev.has(p) ? 0.15 : 0) + rng() * 1e-6,
      })).sort((a, b) => a.key - b.key);
      const chosen = cands.slice(0, free.length).map(c => c.p);
      let best = null, bestCost = Infinity;
      for (const perm of permutations(chosen)) {
        let cost = 0;
        perm.forEach((p, k) => { const fi = free[k]; cost += (Fq[p][fi] || 0) * 10 + H[p] * hours[fi] * 0.01; });
        if (cost < bestCost) { bestCost = cost; best = perm; }
      }
      free.forEach((fi, k) => { night[fi] = { pid: best && best[k] ? best[k] : null, cubreA: null, lock: false }; });
    }
    const now = new Set();
    night.forEach((s, fi) => { if (s.pid && T[s.pid] !== undefined) { T[s.pid]++; H[s.pid] += hours[fi] || 0; if (fi < nf) Fq[s.pid][fi]++; now.add(s.pid); } });
    prev = now;
  }
}

function localSearch(ctx, grid, fixed, maxPasses = 40) {
  let best = objective(ctx, grid);
  const freeSlots = [];
  grid.forEach((night, di) => night.forEach((s, fi) => { if (!fixed[di][fi]) freeSlots.push([di, fi]); }));
  if (!freeSlots.length) return best;
  let improved = true, passes = 0;
  const empty = () => ({ pid: null, cubreA: null, lock: false });
  while (improved && passes < maxPasses) {
    improved = false; passes++;
    // 1) reemplazar por otra persona disponible
    for (const [di, fi] of freeSlots) {
      const night = grid[di];
      for (const q of ctx.availSet[di]) {
        if (night.some(s => s.pid === q || s.cubreA === q)) continue;
        const old = night[fi];
        night[fi] = { pid: q, cubreA: null, lock: false };
        const v = objective(ctx, grid);
        if (v < best - 1e-9) { best = v; improved = true; } else night[fi] = old;
      }
    }
    // 2) intercambiar franjas dentro de la misma noche
    for (let a = 0; a < freeSlots.length; a++) for (let b = a + 1; b < freeSlots.length; b++) {
      const [da, fa] = freeSlots[a], [db, fb] = freeSlots[b];
      const sa = grid[da][fa], sb = grid[db][fb];
      if (!sa.pid || !sb.pid || sa.pid === sb.pid) continue;
      if (da !== db) {
        // 3) intercambiar personas entre noches distintas
        if (!ctx.availSet[da].has(sb.pid) || !ctx.availSet[db].has(sa.pid)) continue;
        if (grid[da].some((s, k) => (k !== fa && s.pid === sb.pid) || s.cubreA === sb.pid)) continue;
        if (grid[db].some((s, k) => (k !== fb && s.pid === sa.pid) || s.cubreA === sa.pid)) continue;
      }
      grid[da][fa] = sb; grid[db][fb] = sa;
      const v = objective(ctx, grid);
      if (v < best - 1e-9) { best = v; improved = true; } else { grid[da][fa] = sa; grid[db][fb] = sb; }
    }
  }
  void empty;
  return best;
}

function gridFromMonth(state, ctx) {
  const ex = state.meses[ctx.mk] ? state.meses[ctx.mk].noches : {};
  return ctx.dates.map(d => {
    const len = Math.max(ctx.nf, ex[d] ? ex[d].length : 0);
    return Array.from({ length: len }, (_, fi) => {
      const s = ex[d] && ex[d][fi];
      return s ? { pid: s.pid || null, cubreA: s.cubreA || null, lock: !!s.lock } : { pid: null, cubreA: null, lock: false };
    });
  });
}

function writeGrid(state, ctx, grid, estado) {
  const M = state.meses[ctx.mk] || (state.meses[ctx.mk] = { estado: estado || 'borrador', noches: {} });
  M.noches = {};
  ctx.dates.forEach((d, di) => { M.noches[d] = grid[di]; });
}

function diffGrids(state, ctx, before, after) {
  const ch = [];
  ctx.dates.forEach((d, di) => after[di].forEach((s, fi) => {
    const o = before[di] && before[di][fi];
    if ((o ? o.pid : null) !== s.pid) ch.push({ date: d, fi, de: o ? o.pid : null, a: s.pid, lock: o ? o.lock : false });
  }));
  return ch;
}

/* Generar (o regenerar) un mes. Se conservan: noches pasadas, casilleros con candado y cambios entre compañeros. */
function generateMonth(state, mk, today) {
  const ctx = buildContext(state, mk);
  const grid = gridFromMonth(state, ctx);
  const fixed = grid.map((night, di) => night.map(s => !!(s.pid && (ctx.dates[di] < today || s.lock || s.cubreA))));
  grid.forEach((night, di) => night.forEach((s, fi) => { if (!fixed[di][fi]) night[fi] = { pid: null, cubreA: null, lock: false }; }));
  const seed = (+state.config.semilla || 1) * 1000 + Number(mk.replace('-', ''));
  greedyFill(ctx, grid, fixed, mulberry32(seed));
  const score = localSearch(ctx, grid, fixed);
  const faltantes = [];
  grid.forEach((night, di) => night.forEach((s, fi) => { if (!s.pid) faltantes.push({ date: ctx.dates[di], fi }); }));
  writeGrid(state, ctx, grid);
  return { score, faltantes, dates: ctx.dates };
}

/* Reasigna todo turno futuro (desde hoy) cuyo responsable ya no está disponible.
   Cambia solo esos casilleros; el resto queda igual. */
function reassignUnavailable(state, today) {
  const changes = [];
  const mks = Object.keys(state.meses).sort();
  for (const mk of mks) {
    const ctx = buildContext(state, mk);
    const grid = gridFromMonth(state, ctx);
    const affected = [];
    grid.forEach((night, di) => night.forEach((s, fi) => {
      const d = ctx.dates[di];
      if (d >= today && s.pid && !ctx.availSet[di].has(s.pid)) affected.push([di, fi, s]);
    }));
    if (!affected.length) continue;
    for (const [di, fi] of affected) grid[di][fi] = { pid: null, cubreA: null, lock: false };
    for (const [di, fi, old] of affected) {
      let bestQ = null, bestV = Infinity;
      for (const q of ctx.availSet[di]) {
        if (grid[di].some(s => s.pid === q || s.cubreA === q)) continue;
        grid[di][fi] = { pid: q, cubreA: null, lock: false };
        const v = objective(ctx, grid);
        if (v < bestV) { bestV = v; bestQ = q; }
      }
      grid[di][fi] = { pid: bestQ, cubreA: null, lock: false };
      changes.push({ mk, date: ctx.dates[di], fi, de: old.pid, a: bestQ, lock: !!old.lock });
    }
    writeGrid(state, ctx, grid);
  }
  return changes;
}

/* Reequilibra las noches desde una fecha (sin tocar pasadas, candados ni cambios). */
function rebalanceFrom(state, desde, today) {
  const start = desde > today ? desde : today;
  const changes = [];
  for (const mk of Object.keys(state.meses).sort()) {
    if (mk < F.mk(start)) continue;
    const ctx = buildContext(state, mk);
    const grid = gridFromMonth(state, ctx);
    const before = grid.map(n => n.map(s => ({ ...s })));
    const fixed = grid.map((night, di) => night.map(s => !(ctx.dates[di] >= start && !s.lock && !s.cubreA)));
    // completar vacíos primero
    grid.forEach((night, di) => night.forEach((s, fi) => {
      if (!fixed[di][fi] && !s.pid) {
        const q = [...ctx.availSet[di]].find(x => !night.some(t => t.pid === x || t.cubreA === x));
        night[fi] = { pid: q || null, cubreA: null, lock: false };
      }
    }));
    localSearch(ctx, grid, fixed);
    for (const c of diffGrids(state, ctx, before, grid)) changes.push({ mk, ...c });
    writeGrid(state, ctx, grid);
  }
  return changes;
}

/* Conflictos de una noche (para alertas en pantalla) */
function slotProblem(state, date, pid) {
  const p = personById(state, pid);
  if (!p) return null;
  return reasonUnavailable(state, p, date);
}

/* ---------------- Importar CSV de licencias ---------------- */
function parseLicenciasCSV(text) {
  const lines = String(text).replace(/^﻿/, '').split(/\r?\n/).filter(l => l.trim());
  const rows = [];
  for (const line of lines) {
    const cols = line.split(';').map(c => c.trim().replace(/^"|"$/g, ''));
    if (!cols[0] || /APELLIDO/i.test(cols[0])) continue;
    const franjas = [];
    for (const c of cols.slice(5)) {
      if (!c) continue;
      const m = c.split(/\s+-\s+/);
      const a = F.fromDMY(m[0]), b = F.fromDMY(m[1] || m[0]);
      if (a && b) franjas.push({ inicio: a <= b ? a : b, fin: a <= b ? b : a });
    }
    rows.push({ nombre: cols[0], guardia: cols[1] || '', franjas });
  }
  return rows;
}

function matchPerson(state, nombreCompleto) {
  const n = norm(nombreCompleto);
  return state.personal.find(p => norm(`${p.apellido} ${p.nombre}`) === n) ||
    state.personal.find(p => norm(`${p.nombre} ${p.apellido}`) === n) || null;
}

/* Reemplaza las licencias anuales de las personas encontradas por las del CSV */
function applyLicenciasCSV(state, rows) {
  const encontrados = [], noEncontrados = [];
  for (const r of rows) {
    const p = matchPerson(state, r.nombre);
    if (!p) { noEncontrados.push(r.nombre); continue; }
    state.ausencias = state.ausencias.filter(a => !(a.pid === p.id && a.tipo === 'anual'));
    for (const fr of r.franjas) state.ausencias.push({ id: uid(), pid: p.id, tipo: 'anual', inicio: fr.inicio, fin: fr.fin, motivo: '' });
    encontrados.push({ p, n: r.franjas.length });
  }
  return { encontrados, noEncontrados };
}

/* ---------------- Auditoría ---------------- */
function audit(state, accion, detalle, extra = {}) {
  state.auditoria.push({ id: uid(), ts: F.nowStamp(), accion, detalle, quien: extra.quien || '', motivo: extra.motivo || '', pids: extra.pids || [] });
}

function seedState() {

function validateBackup(obj) {
  if (!obj || typeof obj !== 'object') return 'El archivo no es un respaldo válido.';

  if (!Array.isArray(d.auditoria)) d.auditoria = [];

<script>

const STORE_KEY = 'nocturnasGuardiaA_v1';

/* ---------------- Persistencia ---------------- */
function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) { const o = JSON.parse(raw); if (!validateBackup(o)) return o.data || o; }
  } catch (e) { console.error(e); }

}
function migrate(st) {

  st.personal.forEach(p => { if (p.hace === undefined) p.hace = true; });
  st.app = APP_ID; st.version = APP_VERSION;

}
function save() {

/* ---------------- Utilidades de UI ---------------- */
function toast(msg, ms = 2600) {
  const t = document.getElementById('toast');
  t.innerHTML = `<div class="bg-slate-900 text-white px-4 py-2.5 rounded-lg shadow-lg text-sm max-w-[90vw]">${esc(msg)}</div>`;
  clearTimeout(toast._t); toast._t = setTimeout(() => { t.innerHTML = ''; }, ms);
}

function formVals(form) {
  const o = {};
  form.querySelectorAll('[name]').forEach(el => {
    if (el.type === 'checkbox') o[el.name] = el.checked;
    else if (el.type === 'radio') { if (el.checked) o[el.name] = el.value; }
    else o[el.name] = el.value.trim();
  });
  return o;
}

/* buttons: [{label, value, cls, validate(vals), onClick(vals), keep}] */
function openModal(title, bodyHtml, buttons, onOpen) {
  return new Promise(resolve => {
    const root = document.getElementById('modal-root');
    root.innerHTML = `
    <div class="fixed inset-0 bg-black/50 z-50 flex items-end sm:items-center justify-center p-2">
      <div class="bg-white rounded-xl w-full max-w-lg max-h-[92vh] overflow-auto shadow-2xl" role="dialog" aria-modal="true">
        <div class="px-4 py-3 border-b font-bold text-lg sticky top-0 bg-white">${esc(title)}</div>
        <form id="mform" class="p-4 space-y-3 text-sm" autocomplete="off">${bodyHtml}
          <div id="merr" class="text-red-600 font-semibold"></div></form>
        <div class="px-4 py-3 border-t flex flex-wrap gap-2 justify-end sticky bottom-0 bg-white">
          ${buttons.map((b, i) => `<button type="button" data-mi="${i}" class="${b.cls || C_SEC}">${esc(b.label)}</button>`).join('')}
        </div>
      </div>
    </div>`;
    const form = root.querySelector('#mform');
    form.addEventListener('submit', e => e.preventDefault());
    root.querySelectorAll('[data-mi]').forEach(btn => btn.addEventListener('click', () => {
      const b = buttons[+btn.dataset.mi];
      const vals = formVals(form);
      if (b.validate) { const err = b.validate(vals, form); if (err) { root.querySelector('#merr').textContent = err; return; } }
      if (b.onClick) b.onClick(vals);
      if (b.keep) return;
      root.innerHTML = '';
      resolve({ value: b.value ?? null, vals });
    }));
    if (onOpen) onOpen(form);
    const first = form.querySelector('input:not([type=hidden]):not([type=checkbox]):not([type=radio]),select,textarea');
    if (first && window.innerWidth > 640) first.focus();
  });
}

async function showChanges(title, changes, intro = '') {

function copyText(txt) {
  const done = () => toast('Copiado. Pegalo en WhatsApp.');
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(txt).then(done, () => fallback());
  else fallback();
  function fallback() {
    const ta = document.createElement('textarea'); ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch (e) { alert(txt); }
    ta.remove();
  }

function pickFile(accept) {
  return new Promise(res => {
    const inp = document.createElement('input'); inp.type = 'file'; inp.accept = accept;
    inp.onchange = () => res(inp.files[0] || null);
    inp.click();
  });
}
function readFileText(file, enc = 'utf-8') {
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsText(file, enc); });
}

function absentList(date) {
  return S.personal.filter(p => !p.baja && p.hace !== false && !available(S, p, date)).map(p => {

}

/* ---------------- Vista: Equidad ---------------- */
function equidadData() {
  const today = TODAY();
  const st = statsFrom(S, realizedNights(S, today));
  const prog = {}, mes = {};
  for (const n of allNights(S)) {
    n.slots.forEach(s => {
      if (!s || !s.pid) return;
      if (n.date >= today) prog[s.pid] = (prog[s.pid] || 0) + 1;
      if (n.mk === ui.mk) mes[s.pid] = (mes[s.pid] || 0) + 1;
    });
  }
  const people = S.personal.filter(elegible).sort((a, b) => shortName(S, a).localeCompare(shortName(S, b)));
  const conDisp = people.filter(p => st[p.id].D > 0);
  const mean = conDisp.length ? conDisp.reduce((a, p) => a + rateOf(st[p.id]), 0) / conDisp.length : 0;
  const ind = people.filter(p => !medicaActiva(S, p.id) && st[p.id].D > 0);
  const Ts = ind.map(p => st[p.id].T), Hs = ind.map(p => st[p.id].H), Rs = ind.map(p => rateOf(st[p.id]));
  const rng = a => a.length ? Math.max(...a) - Math.min(...a) : 0;
  return { st, prog, mes, people, mean, dT: rng(Ts), dH: rng(Hs), dR: rng(Rs) };
}

      <td class="p-2 text-center">${s.D}</td><td class="p-2 text-center font-bold whitespace-nowrap ${hi ? 'text-amber-700' : lo ? 'text-sky-700' : ''}">${s.D ? pct(r) : '—'} ${hi ? '▲' : lo ? '▼' : ''}</td>

  h += `</tbody></table></div>`;

async function printHtml(html, title) {
  const pr = document.getElementById('print-root');
  pr.innerHTML = html;
  await Promise.all([...pr.querySelectorAll('img')].map(i => i.complete ? 1 : new Promise(r => { i.onload = i.onerror = r; })));
  const old = document.title; document.title = title;
  setTimeout(() => { window.print(); setTimeout(() => { document.title = old; }, 800); }, 60);
}

/* ---------------- Vista previa (antes de descargar) ---------------- */
function closePreview() { document.getElementById('preview-root').innerHTML = ''; document.body.style.overflow = ''; }
function previewShell(title, inner, buttons, note) {
  const root = document.getElementById('preview-root');
  root.innerHTML = `<div class="fixed inset-0 z-[70] bg-slate-600 flex flex-col">
    <div class="bg-[#0f2a4a] text-white px-3 py-2 shadow">
      <div class="flex flex-wrap items-center gap-2 justify-between">
        <div class="font-bold text-sm sm:text-base">👁️ Vista previa · ${esc(title)}</div>
        <div class="flex flex-wrap gap-2">${buttons.map((b, i) => `<button data-pv="${i}" class="${b.cls || C_SEC}">${esc(b.label)}</button>`).join('')}
          <button data-pv="x" class="${C_SEC}">✕ Cerrar</button></div></div>
      ${note ? `<div class="text-xs text-blue-100 mt-1">${note}</div>` : ''}</div>
    <div id="pv-scroll" class="flex-1 overflow-auto p-2 sm:p-4">${inner}</div></div>`;
  document.body.style.overflow = 'hidden';
  root.querySelectorAll('[data-pv]').forEach(btn => btn.addEventListener('click', () => {
    if (btn.dataset.pv === 'x') return closePreview();
    const b = buttons[+btn.dataset.pv]; b.onClick();
    if (b.close) closePreview();
  }));
}
function showPreview(title, html, fileTitle) {
  previewShell(title, `<div id="pv-zoom"><div class="pv-page">${html}</div></div>`,
    [{ label: '⬇️ Descargar PDF', cls: C_OK, onClick: () => printHtml(html, fileTitle) }],
    'Revisá el documento. Si está bien, tocá <b>Descargar PDF</b> y en la ventana que se abre elegí <b>“Guardar como PDF”</b> (o una impresora).');
  const fit = () => {
    const sc = document.getElementById('pv-scroll'), z = document.getElementById('pv-zoom');
    if (!sc || !z) return;
    const k = Math.min(1, (sc.clientWidth - 8) / 794);
    z.style.zoom = k < 1 ? String(k) : '';
  };
  fit(); window.addEventListener('resize', fit, { once: true });
}

function monthPrintHtml(mk) {
  const M = S.meses[mk];
  if (!M) return '<p>Mes sin generar.</p>';
  const dates = Object.keys(M.noches).sort();
  const nf = S.config.franjas.length;
  const [y, m] = mk.split('-').map(Number);
  const mStart = `${mk}-01`, mEnd = `${mk}-${pad2(new Date(Date.UTC(y, m, 0)).getUTCDate())}`;
  let h = `<div class="pm ${dates.length > 10 ? 'pm-c' : ''}">
  <div class="pm-top"><img src="logo-etac.png" class="lg-etac" alt="ETAC"><div class="t"><b>ETAC – ${esc(S.config.base)}</b><br>Guardia ${esc(S.config.guardia)} · Guardias nocturnas</div></div>
  ${M.estado !== 'publicado' ? '<div class="pm-bor">BORRADOR – NO PUBLICADO</div>' : ''}
  <table class="pm-t"><tr><th colspan="3" class="pm-y">Guardia ${esc(S.config.guardia)}</th></tr>
  <tr><th colspan="3" class="pm-g">Guardias Nocturnas-${F.mesNombre(mk)} ${y}</th></tr>
  <tr class="pm-h"><th>DIA</th><th>HORARIO</th><th>PERSONAL</th></tr>`;
  dates.forEach((d, k) => {
    const slots = M.noches[d]; const n = Math.max(nf, slots.length);
    for (let fi = 0; fi < n; fi++) {
      const s = slots[fi];
      const name = s && s.pid ? shortById(S, s.pid) + (s.cubreA ? ` (${shortById(S, s.cubreA)})` : '') : '';
      h += `<tr>${fi === 0 ? `<td rowspan="${n}" class="pm-d">${F.corto(d)}</td>` : ''}<td class="pm-hr">${esc(franjaLabel(S, fi))}</td><td class="pm-p">${esc(name)}</td></tr>`;
    }
    if (k < dates.length - 1) h += `<tr class="pm-sp"><td colspan="3"></td></tr>`;
  });
  h += `</table>
  <div class="pm-foot"><span>Impreso: ${esc(F.nowStamp().replace(/^(\d{4})-(\d\d)-(\d\d)/, '$3/$2/$1'))}</span><span>Generado con criterio de reparto equitativo</span><span style="display:flex;align-items:center;gap:2mm"><img src="logo-jmm.png" class="lg-jmm" alt="JMM">Sistema desarrollado por JMM Gestiones y Tecnologías</span></div></div>`;

  // Página 2: resumen y ausencias
  const cnt = {};
  for (const d of dates) M.noches[d].forEach((s, fi) => {
    if (!s || !s.pid) return;
    const c = cnt[s.pid] || (cnt[s.pid] = { T: 0, H: 0, F: Array(nf).fill(0), hechos: 0, recibidos: 0 });
    c.T++; c.H += hoursOf(S, fi); if (fi < nf) c.F[fi]++;
    if (s.cubreA) { c.hechos++; (cnt[s.cubreA] || (cnt[s.cubreA] = { T: 0, H: 0, F: Array(nf).fill(0), hechos: 0, recibidos: 0 })).recibidos++; }
  });
  const ppl = S.personal.filter(p => cnt[p.id] || (elegible(p) && activeOn(p, mEnd))).sort((a, b) => shortName(S, a).localeCompare(shortName(S, b)));
  const aus = S.ausencias.filter(a => a.inicio <= mEnd && (a.fin == null || a.fin >= mStart)).map(a => ({ a, p: personById(S, a.pid) })).filter(x => x.p && !x.p.baja)
    .sort((x, z) => shortName(S, x.p).localeCompare(shortName(S, z.p)));
  h += `<div class="pb rep cmp"><div class="head"><div style="display:flex;align-items:center;gap:4mm"><img src="logo-etac.png" class="lg-etac" alt="ETAC"><div><h1>Guardia ${esc(S.config.guardia)} – Guardias Nocturnas – ${F.mkLabel(mk)}</h1><div class="muted">Resumen del mes · ETAC ${esc(S.config.base)}</div></div></div></div>
  <h2>Turnos del mes por efectivo</h2><table><tr><th>Efectivo</th><th class="num">Turnos</th><th class="num">Horas</th>${S.config.franjas.map(f => `<th class="num">${esc(f.label.replace(/hs$/, ''))}</th>`).join('')}<th class="num">Cambios hechos / recibidos</th></tr>
  ${ppl.map(p => { const c = cnt[p.id] || { T: 0, H: 0, F: Array(nf).fill(0), hechos: 0, recibidos: 0 }; return `<tr><td>${esc(shortName(S, p))}</td><td class="num">${c.T}</td><td class="num">${num(c.H)}</td>${c.F.map(x => `<td class="num">${x}</td>`).join('')}<td class="num">${c.hechos} / ${c.recibidos}</td></tr>`; }).join('')}</table>
  <h2>Ausentes durante el mes</h2>${aus.length ? `<table><tr><th>Efectivo</th><th>Tipo</th><th>Período</th></tr>${aus.map(({ a, p }) => `<tr><td>${esc(shortName(S, p))}</td><td>${esc(ausLabel(a))}</td><td>${F.fmt(a.inicio)} al ${a.fin ? F.fmt(a.fin) : 'sin fecha de regreso'}</td></tr>`).join('')}</table>` : '<p>Sin ausencias en el mes.</p>'}
  <p class="muted" style="margin-top:4mm;white-space:normal">Criterio: en cada noche se asigna a quienes tienen menos turnos en proporción a las guardias en que estuvieron disponibles; además se rotan las franjas y se evita repetir en guardias seguidas. Quien está de licencia no recibe turnos.</p>
  <div class="brand-foot"><img src="logo-jmm.png" class="lg-jmm" alt="JMM"><span>Sistema desarrollado por JMM Gestiones y Tecnologías · Impreso: ${esc(F.nowStamp().replace(/^(\d{4})-(\d\d)-(\d\d)/, '$3/$2/$1'))}</span></div></div>`;
  return h;
}

function reportHtml(pid, desde, hasta) {
  const p = personById(S, pid); if (!p) return '';
  const today = TODAY();
  const nf = S.config.franjas.length;
  const inR = d => (!desde || d >= desde) && (!hasta || d <= hasta);
  const allR = allNights(S).filter(n => inR(n.date));
  const nights = allR.filter(n => n.estado === 'publicado');
  const realized = nights.filter(n => n.date < today);
  const st = statsFrom(S, realized);
  const me = st[pid];
  const group = S.personal.filter(q => st[q.id].D > 0 && (!q.baja || q.id === pid) && q.hace !== false);
  const agg = f => {
    const v = group.map(q => f(st[q.id]));
    return v.length ? { avg: v.reduce((a, b) => a + b, 0) / v.length, min: Math.min(...v), max: Math.max(...v) } : { avg: 0, min: 0, max: 0 };
  };
  const metrics = [
    ['Turnos realizados', s => s.T, x => num(x)],
    ['Horas de nocturna', s => s.H, x => num(x)],
    ...S.config.franjas.map((f, i) => [`Franja ${f.label.replace(/hs$/, '')}`, s => s.F[i] || 0, x => num(x)]),
    ['Guardias disponibles', s => s.D, x => num(x)],
    ['Tasa (turnos ÷ guardias disp.)', s => rateOf(s), x => pct(x)],
  ];
  const rows = metrics.map(([l, f, fm]) => { const a = agg(f); return { l, me: f(me), ...a, fm }; });
  const periodo = desde || hasta ? `${desde ? F.fmt(desde) : 'inicio'} al ${hasta ? F.fmt(hasta) : 'hoy'}` : 'Todo el historial';
  const rate = rateOf(me), avgRate = agg(s => rateOf(s)).avg;
  const verdict = !realized.length ? '<span class="muted">Todavía no hay nocturnas realizadas en este período (las fechas son futuras o el mes no está publicado). Abajo figuran sus turnos programados.</span>'
    : me.D === 0 ? '<span class="muted">No estuvo disponible en guardias del período.</span>'
    : rate > avgRate * 1.15 ? `<span class="hi">Está por encima del promedio de la guardia.</span> El sistema le asignará menos turnos en los próximos repartos hasta equilibrar.`
    : rate < avgRate * 0.85 ? `<span class="lo">Está por debajo del promedio de la guardia.</span> El sistema le asignará más turnos en los próximos repartos hasta equilibrar.`
    : `<span class="ok">Está dentro del promedio de la guardia.</span>`;

  // turnos
  const turnos = [];
  for (const n of allR) n.slots.forEach((s, fi) => {
    if (!s) return;
    if (s.pid === pid) turnos.push({ d: n.date, est: n.estado, fi, tipo: s.cubreA ? `Cubrió a ${shortById(S, s.cubreA)}` : 'Propio', cuenta: true });
    else if (s.cubreA === pid) turnos.push({ d: n.date, est: n.estado, fi, tipo: `Lo cubrió ${shortById(S, s.pid)}`, cuenta: false });
  });
  // no disponible
  const noDisp = [];
  for (const n of nights) {
    if (n.slots.some(s => s && s.pid === pid)) continue;
    const r = reasonUnavailable(S, p, n.date);
    if (!r) continue;
    const a = absenceOn(S, pid, n.date);
    const key = a ? a.id : r;
    let g = noDisp.find(x => x.key === key);
    if (!g) noDisp.push(g = { key, r, a, dates: [] });
    g.dates.push(n.date);
  }
  const auds = S.auditoria.filter(a => (a.pids || []).includes(pid)).slice(-40);
  const maxOf = (r) => Math.max(r.me, r.avg, r.max, 0.0001);
  const bars = rows.filter(r => /Turnos|Horas|Tasa/.test(r.l)).map(r => `<tr><td style="width:32%">${esc(r.l)}</td><td>
      <div><span class="bar b1" style="width:${(r.me / maxOf(r) * 100 * 0.8).toFixed(1)}%"></span> <b>${r.fm(r.me)}</b> ${esc(shortName(S, p))}</div>
      <div><span class="bar b2" style="width:${(r.avg / maxOf(r) * 100 * 0.8).toFixed(1)}%"></span> ${r.fm(r.avg)} promedio</div></td></tr>`).join('');

  return `<div class="rep">
  <div class="head"><div style="display:flex;align-items:center;gap:4mm"><img src="logo-etac.png" class="lg-etac" alt="ETAC"><div><h1>Informe individual de guardias nocturnas</h1>
    <div class="muted">Guardia ${esc(S.config.guardia)} · ${esc(S.config.base)}</div></div></div>
    <div class="muted" style="text-align:right">Emitido: ${F.fmt(today)}</div></div>
  <table style="margin-top:3mm"><tr><th style="width:25%">Efectivo</th><td><b>${esc(fullName(p))}</b> (${esc(shortName(S, p))})</td></tr>
    <tr><th>Período</th><td>${periodo}</td></tr>
    <tr><th>Situación actual</th><td>${p.baja ? `Baja desde ${F.fmt(p.baja.fecha)}` : medicaActiva(S, pid) ? `Licencia médica desde ${F.fmt(medicaActiva(S, pid).inicio)}` : p.hace === false ? 'No hace nocturna' : 'Activo'}</td></tr></table>
  <h2>Resultado</h2><div class="box">${verdict}</div>
  <h2>Comparación con la guardia</h2>
  <table><tr><th>Indicador</th><th class="num">${esc(shortName(S, p))}</th><th class="num">Promedio</th><th class="num">Mínimo</th><th class="num">Máximo</th></tr>
  ${rows.map(r => `<tr><td>${esc(r.l)}</td><td class="num"><b>${r.fm(r.me)}</b></td><td class="num">${r.fm(r.avg)}</td><td class="num">${r.fm(r.min)}</td><td class="num">${r.fm(r.max)}</td></tr>`).join('')}</table>
  <p class="muted" style="font-size:8.5pt">Se comparan ${group.length} efectivos con al menos una guardia disponible en el período. Solo cuentan turnos realizados (fecha pasada y mes publicado).</p>
  <table style="margin-top:2mm">${bars}</table>
  <h2>Detalle de turnos (${turnos.filter(t => t.cuenta).length})</h2>
  ${turnos.length ? `<table><tr><th>Fecha</th><th>Franja</th><th class="num">Horas</th><th>Tipo</th><th>Estado</th></tr>
  ${turnos.map(t => `<tr><td>${F.fmt(t.d)} <span class="muted">${dia(t.d)}</span></td><td>${esc(franjaLabel(S, t.fi))}</td><td class="num">${t.cuenta ? num(hoursOf(S, t.fi)) : '—'}</td><td>${esc(t.tipo)}${t.cuenta ? '' : ' <span class="muted">(no le cuenta)</span>'}</td><td>${t.est !== 'publicado' ? 'Borrador' : t.d < today ? 'Realizado' : 'Programado'}</td></tr>`).join('')}</table>` : '<p>No tiene turnos en el período.</p>'}
  <h2>Guardias en que no estuvo disponible</h2>
  ${noDisp.length ? `<table><tr><th>Motivo</th><th>Período</th><th class="num">Guardias</th><th>Fechas</th></tr>
  ${noDisp.map(g => `<tr><td>${esc(g.r)}</td><td>${g.a ? `${F.fmt(g.a.inicio)} al ${g.a.fin ? F.fmt(g.a.fin) : 'sin fecha de regreso'}` : '—'}</td><td class="num">${g.dates.length}</td><td>${g.dates.map(F.corto).join(', ')}</td></tr>`).join('')}</table>` : '<p>Estuvo disponible en todas las guardias del período.</p>'}
  <h2>Modificaciones que lo involucran</h2>
  ${auds.length ? `<table><tr><th style="width:18%">Fecha</th><th>Acción</th><th>Detalle</th><th>Motivo / quién</th></tr>
  ${auds.map(a => `<tr><td>${esc(a.ts.replace(/^(\d{4})-(\d\d)-(\d\d)/, '$3/$2/$1'))}</td><td>${esc(a.accion)}</td><td style="white-space:pre-line">${esc(a.detalle)}</td><td>${esc(a.motivo)}${a.quien ? ` <span class="muted">(${esc(a.quien)})</span>` : ''}</td></tr>`).join('')}</table>` : '<p>No hubo ediciones manuales ni reasignaciones que lo afecten.</p>'}
  <h2>¿Cómo se reparten las nocturnas?</h2>
  <p>En cada noche de guardia se asigna a quienes tienen <b>menos turnos en proporción a las guardias en que estuvieron disponibles</b> (sin licencia ni ausencia). Por eso no se compara solo la cantidad de turnos: quien estuvo de licencia tuvo menos guardias disponibles. Además, el sistema rota las franjas para que la de 00:00 a 03:30 no le toque siempre a la misma persona, y evita, si puede, que alguien haga nocturna en dos guardias seguidas. Los empates se resuelven por sorteo con una semilla fija, así el resultado se puede reproducir. Toda edición manual queda registrada con su motivo y quién la hizo.</p>
  <div class="sig"><div>Firma del efectivo</div><div>Firma del responsable</div></div>
  <div class="brand-foot"><img src="logo-jmm.png" class="lg-jmm" alt="JMM"><span>Sistema desarrollado por JMM Gestiones y Tecnologías</span></div>
  </div>`;
}

ACT.generar = async () => {
  const mk = ui.mk, M = S.meses[mk], today = TODAY();
  let note = `<p>Se van a repartir las nocturnas de <b>${F.mkLabel(mk)}</b> con el criterio de equidad.</p>`;
  if (M) note += `<p>Se conservan las noches que ya pasaron, los casilleros con candado 🔒 y los cambios entre compañeros. El resto se vuelve a calcular.</p>`;
  if (M && M.estado === 'publicado') note += `<p class="text-amber-700 font-semibold">⚠ El mes ya está publicado: si cambia algo, avisá al personal.</p>`;
  const r = await openModal('Generar nocturnas', note + quienField() + motivoField(false, 'Observación'), [
    { label: 'Cancelar' }, { label: M ? 'Regenerar' : 'Generar', value: 'ok', cls: C_PRI, validate: reqQuien }]);
  if (!r.value) return;
  rememberQuien(r.vals);
  const before = M ? JSON.parse(JSON.stringify(M.noches)) : null;
  const res = generateMonth(S, mk, today);
  let det = `${F.mkLabel(mk)}: ${res.dates.length} noches. ${res.faltantes.length ? res.faltantes.length + ' franja(s) sin cubrir.' : 'Todas las franjas cubiertas.'}`;
  let pids = [];
  if (before && S.meses[mk].estado === 'publicado') {
    const ch = [];
    for (const [d, slots] of Object.entries(S.meses[mk].noches)) slots.forEach((s, fi) => { const o = before[d] && before[d][fi]; if ((o ? o.pid : null) !== s.pid) ch.push({ date: d, fi, de: o ? o.pid : null, a: s.pid }); });
    if (ch.length) { det += '\nCambios:\n' + ch.map(chgLine).join('\n'); pids = chgPids(ch); }
  }
  audit(S, M ? 'Regeneración' : 'Generación', det, { quien: r.vals.quien, motivo: r.vals.motivo, pids });
  save(); render();
  if (res.faltantes.length) alertDlg('Faltan personas', `<p>No alcanzó el personal disponible para ${res.faltantes.length} franja(s):</p><ul class="list-disc pl-5">${res.faltantes.map(f => `<li>${F.fmt(f.date)} · ${esc(franjaLabel(S, f.fi))}</li>`).join('')}</ul><p>Completalas a mano con ✏️.</p>`);
  else toast('Nocturnas generadas. Revisalas y publicá el mes.');
};

ACT.publicar = async () => {
  const mk = ui.mk;
  const r = await openModal('Publicar mes', `<p>Al publicar <b>${F.mkLabel(mk)}</b>, los turnos van a contar para la equidad a medida que se realicen. Después se puede seguir editando, pero todo queda registrado.</p>${quienField()}`,
    [{ label: 'Cancelar' }, { label: 'Publicar', value: 'ok', cls: C_OK, validate: reqQuien }]);
  if (!r.value) return;
  rememberQuien(r.vals);
  const vac = Object.values(S.meses[mk].noches).flat().filter(s => !s.pid).length;
  S.meses[mk].estado = 'publicado';
  audit(S, 'Publicación', `${F.mkLabel(mk)} publicado.${vac ? ` Atención: ${vac} franja(s) sin cubrir.` : ''}`, { quien: r.vals.quien });
  save(); render();
  const b = await openModal('Mes publicado ✅', `<p>¿Descargás ahora una copia de respaldo?</p>`, [{ label: 'Más tarde' }, { label: 'PDF del mes', keep: true, onClick: () => previewMonth(mk) }, { label: 'Respaldo', value: 'bk', cls: C_OK }]);
  if (b.value === 'bk') previewBackup();
};

ACT.lock = d => {
  const M = S.meses[ui.mk]; const s = M && M.noches[d.date] && M.noches[d.date][+d.fi]; if (!s) return;
  s.lock = !s.lock;
  audit(S, s.lock ? 'Candado puesto' : 'Candado quitado', `${F.fmt(d.date)} · ${franjaLabel(S, +d.fi)}: ${shortById(S, s.pid)}`, { quien: S.config.quien, pids: s.pid ? [s.pid] : [] });
  save(); render();
};

function personOptions(date, night, fi, statsNow, opts = {}) {
  const inNight = new Set(night.flatMap((s, k) => k === fi || !s ? [] : [s.pid, s.cubreA]).filter(Boolean));
  const ppl = S.personal.filter(p => !p.baja);
  const disp = ppl.filter(p => available(S, p, date) && !inNight.has(p.id) && !(opts.excl || []).includes(p.id))
    .sort((a, b) => rateOf(statsNow[a.id]) - rateOf(statsNow[b.id]));
  const noDisp = ppl.filter(p => !disp.includes(p) && !(opts.excl || []).includes(p.id));
  const o = p => { const s = statsNow[p.id]; return `${shortName(S, p)} — ${s.T} turnos, tasa ${s.D ? pct(rateOf(s)) : '—'}`; };
  return `<optgroup label="Disponibles (de menor a mayor carga)">${disp.map(p => `<option value="${p.id}">${esc(o(p))}</option>`).join('')}</optgroup>
    <optgroup label="No disponibles">${noDisp.map(p => `<option value="${p.id}" data-bad="1">${esc(shortName(S, p))} — ${esc(inNight.has(p.id) ? 'ya está en esa noche' : reasonUnavailable(S, p, date) || '')}</option>`).join('')}</optgroup>`;
}
function pastConfirmField(date) {
  const M = S.meses[ui.mk];
  return date < TODAY() && M && M.estado === 'publicado'
    ? `<label class="flex items-start gap-2 bg-amber-50 border border-amber-200 rounded p-2"><input type="checkbox" name="confPast" class="mt-1"> <span>Esta noche <b>ya pasó</b>. Confirmo que corrijo un registro realizado.</span></label>` : '';
}

ACT.editSlot = async d => {
  const date = d.date, fi = +d.fi, M = S.meses[ui.mk], night = M.noches[date];
  while (night.length <= fi) night.push({ pid: null, cubreA: null, lock: false });
  const s = night[fi];
  const statsNow = statsFrom(S, allNights(S).filter(n => n.date < date));
  const body = `<p><b>${F.fmt(date)}</b> · ${esc(franjaLabel(S, fi))}<br>Actual: <b>${esc(s.pid ? shortById(S, s.pid) : 'sin asignar')}</b></p>
    <label class="${C_LBL}">Asignar a<select name="pid" class="${C_INP}"><option value="">— Dejar sin asignar —</option>${personOptions(date, night, fi, statsNow)}</select></label>
    <label class="flex items-center gap-2"><input type="checkbox" name="forzar"> Asignar igual aunque no esté disponible</label>
    ${pastConfirmField(date)}${motivoField()}${quienField()}`;
  const r = await openModal('Editar turno', body, [{ label: 'Cancelar' }, {
    label: 'Guardar', value: 'ok', cls: C_PRI, validate: (v, form) => {
      const e = reqQM(v); if (e) return e;
      const opt = form.querySelector('select[name=pid]').selectedOptions[0];
      if (opt && opt.dataset.bad && !v.forzar) return 'La persona elegida no está disponible. Tildá “Asignar igual” si corresponde.';
      if (form.querySelector('[name=confPast]') && !v.confPast) return 'Confirmá que corregís una noche que ya pasó.';
      return null;
    },
  }], form => { if (s.pid) form.querySelector('select[name=pid]').value = s.pid; });
  if (!r.value) return;
  rememberQuien(r.vals);
  const old = s.pid, nw = r.vals.pid || null;
  if (old === nw && !s.cubreA) { toast('Sin cambios.'); return; }
  night[fi] = { pid: nw, cubreA: null, lock: s.lock };
  audit(S, 'Edición manual', `${F.fmt(date)} · ${franjaLabel(S, fi)}: ${shortById(S, old) || '—'} → ${nw ? shortById(S, nw) : 'sin asignar'}`, { quien: r.vals.quien, motivo: r.vals.motivo, pids: [old, nw].filter(Boolean) });
  save(); render(); toast('Turno actualizado.');
};

ACT.cambio = async d => {
  const date = d.date, fi = +d.fi, M = S.meses[ui.mk], night = M.noches[date];
  const s = night[fi];
  if (!s || !s.pid) { alertDlg('Registrar cambio', '<p>Primero asigná a alguien en esta franja.</p>'); return; }
  const orig = s.cubreA || s.pid;
  const statsNow = statsFrom(S, allNights(S).filter(n => n.date < date));
  const body = `<p><b>${F.fmt(date)}</b> · ${esc(franjaLabel(S, fi))}<br>Turno de: <b>${esc(shortById(S, orig))}</b>${s.cubreA ? ` · hoy lo cubre <b>${esc(shortById(S, s.pid))}</b>` : ''}</p>
    <label class="${C_LBL}">¿Quién lo cubre?<select name="pid" class="${C_INP}">${personOptions(date, night, fi, statsNow, { excl: [orig] })}</select></label>
    <p class="text-xs text-slate-500">En la planilla se verá “QUIEN CUBRE (${esc(shortById(S, orig))})”. El turno se le cuenta a quien lo hace.</p>
    ${pastConfirmField(date)}${motivoField(true, 'Ej.: cambio acordado entre ambos')}${quienField()}`;
  const btns = [{ label: 'Cancelar' }];
  if (s.cubreA) btns.push({ label: 'Deshacer cambio', value: 'undo', cls: C_DNG, validate: v => reqQM(v) });
  btns.push({
    label: 'Registrar cambio', value: 'ok', cls: C_PRI, validate: (v, form) => {
      const e = reqQM(v); if (e) return e;
      const opt = form.querySelector('select[name=pid]').selectedOptions[0];
      if (!v.pid) return 'Elegí quién cubre.';
      if (opt && opt.dataset.bad) return 'La persona elegida no está disponible esa noche.';
      if (form.querySelector('[name=confPast]') && !v.confPast) return 'Confirmá que corregís una noche que ya pasó.';
      return null;
    },
  });
  const r = await openModal('Cambio entre compañeros', body, btns);
  if (!r.value) return;
  rememberQuien(r.vals);
  if (r.value === 'undo') {
    const was = s.pid;
    night[fi] = { pid: orig, cubreA: null, lock: s.lock };
    audit(S, 'Cambio deshecho', `${F.fmt(date)} · ${franjaLabel(S, fi)}: vuelve ${shortById(S, orig)} (cubría ${shortById(S, was)})`, { quien: r.vals.quien, motivo: r.vals.motivo, pids: [orig, was] });
  } else {
    night[fi] = { pid: r.vals.pid, cubreA: orig, lock: s.lock };
    audit(S, 'Cambio entre compañeros', `${F.fmt(date)} · ${franjaLabel(S, fi)}: ${shortById(S, r.vals.pid)} cubre a ${shortById(S, orig)}`, { quien: r.vals.quien, motivo: r.vals.motivo, pids: [r.vals.pid, orig] });
  }
  save(); render(); toast('Cambio registrado.');
};

function personForm(p) {
  return `<div class="grid grid-cols-2 gap-3">
    <label class="${C_LBL}">Apellido *<input name="apellido" class="${C_INP}" value="${esc(p ? p.apellido : '')}"></label>
    <label class="${C_LBL}">Nombre *<input name="nombre" class="${C_INP}" value="${esc(p ? p.nombre : '')}"></label></div>
    <label class="${C_LBL}">Nombre en planilla (opcional)<input name="cortoManual" class="${C_INP}" value="${esc(p ? p.cortoManual || '' : '')}" placeholder="Se arma solo: APELLIDO, o APELLIDO + inicial si se repite"></label>
    <label class="${C_LBL}">Fecha de alta en la guardia<input type="date" name="alta" class="${C_INP}" value="${p ? p.alta || '' : TODAY()}"></label>
    <label class="flex items-center gap-2"><input type="checkbox" name="hace" ${!p || p.hace !== false ? 'checked' : ''}> Hace guardias nocturnas</label>

}
const valPerson = v => !v.apellido || !v.nombre ? 'Apellido y nombre son obligatorios.' : reqQuien(v);

ACT.addPerson = async () => {
  const r = await openModal('Agregar efectivo', personForm(null), [{ label: 'Cancelar' }, { label: 'Agregar', value: 'ok', cls: C_PRI, validate: valPerson }]);
  if (!r.value) return;
  rememberQuien(r.vals);
  const p = { id: uid(), apellido: norm(r.vals.apellido), nombre: norm(r.vals.nombre), cortoManual: norm(r.vals.cortoManual), alta: r.vals.alta || TODAY(), hace: r.vals.hace, baja: null, obs: r.vals.obs };
  S.personal.push(p);
  audit(S, 'Alta de efectivo', `${fullName(p)} (desde ${F.fmt(p.alta)})`, { quien: r.vals.quien, pids: [p.id] });
  save(); render(); toast('Efectivo agregado.');
};
ACT.editPerson = async d => {
  const p = personById(S, d.id);
  const r = await openModal('Editar efectivo', personForm(p), [{ label: 'Cancelar' }, { label: 'Guardar', value: 'ok', cls: C_PRI, validate: valPerson }]);
  if (!r.value) return;
  rememberQuien(r.vals);
  const prevHace = p.hace !== false;
  Object.assign(p, { apellido: norm(r.vals.apellido), nombre: norm(r.vals.nombre), cortoManual: norm(r.vals.cortoManual), alta: r.vals.alta || p.alta, hace: r.vals.hace, obs: r.vals.obs });
  audit(S, 'Edición de efectivo', fullName(p), { quien: r.vals.quien, pids: [p.id] });
  if (prevHace && !p.hace) await afterAvailabilityChange('Reasignación automática', `${shortName(S, p)} dejó de hacer nocturna.`, r.vals.quien);

ACT.toggleHace = async d => {
  const p = personById(S, d.id);
  const on = p.hace !== false;
  const r = await openModal(on ? 'Deja de hacer nocturna' : 'Vuelve a hacer nocturna',
    `<p><b>${esc(fullName(p))}</b> ${on ? 'no va a recibir más turnos nocturnos. Sus turnos futuros se reasignan solos.' : 'vuelve a entrar en el reparto desde el próximo mes que se genere.'}</p>${motivoField()}${quienField()}`,
    [{ label: 'Cancelar' }, { label: 'Confirmar', value: 'ok', cls: C_PRI, validate: reqQM }]);
  if (!r.value) return;
  rememberQuien(r.vals);
  p.hace = !on;
  audit(S, on ? 'No hace nocturna' : 'Vuelve a hacer nocturna', fullName(p), { quien: r.vals.quien, motivo: r.vals.motivo, pids: [p.id] });
  if (on) await afterAvailabilityChange('Reasignación automática', `${shortName(S, p)} dejó de hacer nocturna.`, r.vals.quien);
  save(); render();
};

async function afterAvailabilityChange(accion, causa, quien) {
  const changes = reassignUnavailable(S, TODAY());
  if (changes.length) audit(S, accion, `${causa}\n${changes.map(chgLine).join('\n')}`, { quien, pids: chgPids(changes) });
  save(); render();
  await showChanges(accion, changes, esc(causa));
}

ACT.toggleMedica = async d => {
  const p = personById(S, d.id);
  const med = medicaActiva(S, p.id);
  if (!med) {
    const r = await openModal('Licencia médica', `<p><b>${esc(fullName(p))}</b> pasa a licencia médica <b>sin fecha de regreso</b>. Sus turnos desde esa fecha se reasignan solos con el criterio de equidad.</p>
      <label class="${C_LBL}">Desde<input type="date" name="inicio" value="${TODAY()}" class="${C_INP}"></label>
      <p class="text-xs text-slate-500">🔒 No se guarda diagnóstico ni datos de salud: solo “Licencia médica” y las fechas.</p>${quienField()}`,
      [{ label: 'Cancelar' }, { label: 'Confirmar licencia', value: 'ok', cls: C_DNG, validate: v => !v.inicio ? 'Indicá la fecha de inicio.' : reqQuien(v) }]);
    if (!r.value) return;
    rememberQuien(r.vals);
    S.ausencias.push({ id: uid(), pid: p.id, tipo: 'medica', inicio: r.vals.inicio, fin: null, motivo: '' });
    audit(S, 'Licencia médica', `${fullName(p)}: desde ${F.fmt(r.vals.inicio)}, sin fecha de regreso.`, { quien: r.vals.quien, pids: [p.id] });
    await afterAvailabilityChange('Reasignación automática por licencia médica', `${shortName(S, p)} de licencia médica desde ${F.fmt(r.vals.inicio)}.`, r.vals.quien);
  } else {
    const r = await openModal('Fin de licencia médica', `<p><b>${esc(fullName(p))}</b> está de licencia médica desde ${F.fmt(med.inicio)}.</p>
      <label class="${C_LBL}">Fecha de regreso (primer día disponible)<input type="date" name="regreso" value="${TODAY()}" class="${C_INP}"></label>
      <div class="space-y-1"><label class="flex items-start gap-2"><input type="radio" name="modo" value="ahora" checked class="mt-1"> <span><b>Reincorporarlo en las noches que faltan del mes</b> (se reequilibran las noches futuras sin candado)</span></label>
      <label class="flex items-start gap-2"><input type="radio" name="modo" value="esperar" class="mt-1"> <span><b>Esperar al próximo mes</b> (no se toca lo ya armado)</span></label></div>
      <p class="text-xs text-slate-500">Con la regla proporcional no arrastra deuda por los días de licencia.</p>${quienField()}`,
      [{ label: 'Cancelar' }, { label: 'Confirmar regreso', value: 'ok', cls: C_OK, validate: v => !v.regreso ? 'Indicá la fecha de regreso.' : v.regreso <= med.inicio ? 'La fecha de regreso debe ser posterior al inicio de la licencia.' : reqQuien(v) }]);
    if (!r.value) return;
    rememberQuien(r.vals);
    med.fin = F.add(r.vals.regreso, -1);
    audit(S, 'Fin de licencia médica', `${fullName(p)}: licencia del ${F.fmt(med.inicio)} al ${F.fmt(med.fin)}. Disponible desde ${F.fmt(r.vals.regreso)}.`, { quien: r.vals.quien, pids: [p.id] });
    if (r.vals.modo === 'ahora') {
      const changes = rebalanceFrom(S, r.vals.regreso, TODAY());
      if (changes.length) audit(S, 'Reincorporación', `${shortName(S, p)} vuelve desde ${F.fmt(r.vals.regreso)}.\n${changes.map(chgLine).join('\n')}`, { quien: r.vals.quien, pids: chgPids(changes).concat(p.id) });
      save(); render();
      await showChanges('Reincorporación', changes, `${esc(shortName(S, p))} vuelve desde ${F.fmt(r.vals.regreso)}.`);
    } else { save(); render(); toast('Regreso registrado. Entra en el reparto del próximo mes.'); }
  }
};

ACT.bajaPerson = async d => {
  const p = personById(S, d.id);
  const r = await openModal('Dar de baja', `<p><b>${esc(fullName(p))}</b> deja de participar del reparto. Se conserva su historial y sus turnos futuros se reasignan solos.</p>
    <label class="${C_LBL}">Desde<input type="date" name="fecha" value="${TODAY()}" class="${C_INP}"></label>${motivoField(true, 'Ej.: pase a otra guardia')}${quienField()}`,
    [{ label: 'Cancelar' }, { label: 'Dar de baja', value: 'ok', cls: C_DNG, validate: v => !v.fecha ? 'Indicá la fecha.' : reqQM(v) }]);
  if (!r.value) return;
  rememberQuien(r.vals);
  p.baja = { fecha: r.vals.fecha, motivo: r.vals.motivo };
  audit(S, 'Baja de la guardia', `${fullName(p)} desde ${F.fmt(r.vals.fecha)}.`, { quien: r.vals.quien, motivo: r.vals.motivo, pids: [p.id] });
  await afterAvailabilityChange('Reasignación automática por baja', `${shortName(S, p)} dado de baja desde ${F.fmt(r.vals.fecha)}.`, r.vals.quien);
};
ACT.reactivar = async d => {
  const p = personById(S, d.id);
  const r = await openModal('Reactivar', `<p><b>${esc(fullName(p))}</b> vuelve a la guardia y entra en el reparto desde el próximo mes que se genere.</p>${quienField()}`,
    [{ label: 'Cancelar' }, { label: 'Reactivar', value: 'ok', cls: C_OK, validate: reqQuien }]);
  if (!r.value) return;
  rememberQuien(r.vals);
  audit(S, 'Reactivación', `${fullName(p)} (estaba de baja desde ${F.fmt(p.baja.fecha)}).`, { quien: r.vals.quien, pids: [p.id] });
  p.baja = null; save(); render();
};

/* ----- Licencias ----- */
function ausForm(a) {
  const ppl = S.personal.filter(p => !p.baja).sort((x, y) => fullName(x).localeCompare(fullName(y)));
  return `<label class="${C_LBL}">Efectivo<select name="pid" class="${C_INP}">${ppl.map(p => `<option value="${p.id}" ${a && a.pid === p.id ? 'selected' : ''}>${esc(fullName(p))}</option>`).join('')}</select></label>
    <label class="${C_LBL}">Tipo<select name="tipo" class="${C_INP}">${Object.entries(TIPOS_AUS).map(([k, l]) => `<option value="${k}" ${a && a.tipo === k ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
    <div class="grid grid-cols-2 gap-3"><label class="${C_LBL}">Desde<input type="date" name="inicio" value="${a ? a.inicio : ''}" class="${C_INP}"></label>
    <label class="${C_LBL}">Hasta (inclusive)<input type="date" name="fin" value="${a && a.fin ? a.fin : ''}" class="${C_INP}"></label></div>
    <p class="text-xs text-slate-500">En licencia médica, dejá “Hasta” vacío si no se sabe cuándo vuelve.</p>
    <label class="${C_LBL}">Detalle (solo para “Otra ausencia”: capacitación, comisión…)<input name="motivo" value="${esc(a ? a.motivo : '')}" class="${C_INP}"></label>${quienField()}`;
}
const valAus = v => !v.inicio ? 'Indicá la fecha de inicio.' : (!v.fin && v.tipo !== 'medica') ? 'Indicá la fecha de fin.' : (v.fin && v.fin < v.inicio) ? 'La fecha de fin es anterior al inicio.' : (v.tipo === 'medica' && !v.fin && S.ausencias.some(a => a.pid === v.pid && a.tipo === 'medica' && a.fin == null && a.id !== v._id)) ? 'Esa persona ya tiene una licencia médica abierta.' : reqQuien(v);

ACT.addAus = async () => {
  const r = await openModal('Agregar licencia / ausencia', ausForm(null), [{ label: 'Cancelar' }, { label: 'Guardar', value: 'ok', cls: C_PRI, validate: valAus }]);
  if (!r.value) return;
  rememberQuien(r.vals);
  const a = { id: uid(), pid: r.vals.pid, tipo: r.vals.tipo, inicio: r.vals.inicio, fin: r.vals.fin || null, motivo: r.vals.tipo === 'otra' ? r.vals.motivo : '' };
  S.ausencias.push(a);
  audit(S, 'Licencia / ausencia cargada', `${shortById(S, a.pid)}: ${ausLabel(a)} del ${F.fmt(a.inicio)} al ${a.fin ? F.fmt(a.fin) : 'sin fecha'}.`, { quien: r.vals.quien, pids: [a.pid] });
  await afterAvailabilityChange('Reasignación automática por licencia', `${shortById(S, a.pid)}: ${ausLabel(a)} del ${F.fmt(a.inicio)} al ${a.fin ? F.fmt(a.fin) : 'sin fecha'}.`, r.vals.quien);
};
ACT.editAus = async d => {
  const a = S.ausencias.find(x => x.id === d.id); if (!a) return;
  const r = await openModal('Editar licencia / ausencia', ausForm(a), [{ label: 'Cancelar' }, { label: 'Guardar', value: 'ok', cls: C_PRI, validate: v => valAus({ ...v, _id: a.id }) }]);
  if (!r.value) return;
  rememberQuien(r.vals);
  const antes = `${ausLabel(a)} ${F.fmt(a.inicio)}–${a.fin ? F.fmt(a.fin) : 'sin fecha'}`;
  Object.assign(a, { pid: r.vals.pid, tipo: r.vals.tipo, inicio: r.vals.inicio, fin: r.vals.fin || null, motivo: r.vals.tipo === 'otra' ? r.vals.motivo : '' });
  audit(S, 'Licencia / ausencia editada', `${shortById(S, a.pid)}: ${antes} → ${ausLabel(a)} ${F.fmt(a.inicio)}–${a.fin ? F.fmt(a.fin) : 'sin fecha'}`, { quien: r.vals.quien, pids: [a.pid] });
  await afterAvailabilityChange('Reasignación automática por licencia', `${shortById(S, a.pid)}: licencia modificada.`, r.vals.quien);
};
ACT.delAus = async d => {
  const a = S.ausencias.find(x => x.id === d.id); if (!a) return;
  const r = await openModal('Eliminar licencia / ausencia', `<p>¿Eliminar <b>${esc(ausLabel(a))}</b> de <b>${esc(shortById(S, a.pid))}</b> (${F.fmt(a.inicio)} al ${a.fin ? F.fmt(a.fin) : 'sin fecha'})?</p><p class="text-xs text-slate-500">No se modifican turnos ya armados.</p>${motivoField()}${quienField()}`,
    [{ label: 'Cancelar' }, { label: 'Eliminar', value: 'ok', cls: C_DNG, validate: reqQM }]);
  if (!r.value) return;
  rememberQuien(r.vals);
  S.ausencias = S.ausencias.filter(x => x.id !== a.id);
  audit(S, 'Licencia / ausencia eliminada', `${shortById(S, a.pid)}: ${ausLabel(a)} ${F.fmt(a.inicio)}–${a.fin ? F.fmt(a.fin) : 'sin fecha'}`, { quien: r.vals.quien, motivo: r.vals.motivo, pids: [a.pid] });
  save(); render();
};
ACT.importCSV = async () => {
  const file = await pickFile('.csv,text/csv,text/plain');
  if (!file) return;
  let text = await readFileText(file);
  if (text.includes('�')) text = await readFileText(file, 'windows-1252');
  const rows = parseLicenciasCSV(text);
  if (!rows.length) { alertDlg('Importar CSV', '<p>No se encontraron filas válidas. El archivo debe usar “;” como separador y fechas “dd/mm/aaaa - dd/mm/aaaa”.</p>'); return; }
  const found = rows.filter(x => matchPerson(S, x.nombre)), notFound = rows.filter(x => !matchPerson(S, x.nombre));
  const r = await openModal('Importar licencias', `<p>Archivo: <b>${esc(file.name)}</b></p>
    <p>Se encontraron <b>${found.length}</b> efectivos con <b>${found.reduce((a, x) => a + x.franjas.length, 0)}</b> franjas de licencia.</p>
    ${notFound.length ? `<p class="text-amber-700"><b>No encontrados en Personal (no se cargan):</b> ${notFound.map(x => esc(x.nombre)).join(', ')}</p>` : ''}
    <p>Las licencias anuales de esas personas se <b>reemplazan</b> por las del archivo. Si alguna choca con turnos ya armados, se reasignan solos.</p>${quienField()}`,
    [{ label: 'Cancelar' }, { label: 'Importar', value: 'ok', cls: C_PRI, validate: reqQuien }]);
  if (!r.value) return;
  rememberQuien(r.vals);
  const res = applyLicenciasCSV(S, rows);
  audit(S, 'Importación de licencias', `${file.name}: ${res.encontrados.length} efectivos actualizados.${res.noEncontrados.length ? ' No encontrados: ' + res.noEncontrados.join(', ') : ''}`, { quien: r.vals.quien });
  await afterAvailabilityChange('Reasignación automática por licencia', 'Importación de licencias desde CSV.', r.vals.quien);
};

/* ----- Configuración ----- */
function readCfgForm() {
  const v = formVals(document.getElementById('cfg'));
  const franjas = S.config.franjas.map((f, i) => ({ label: v['fl' + i] || f.label, horas: +v['fh' + i] || 0 }));
  return { v, franjas };
}
ACT.addFranja = () => { const { franjas } = readCfgForm(); franjas.push({ label: '00:00 a 00:00', horas: 1 }); S.config.franjas = franjas; render(); toast('Franja agregada. Guardá la configuración.'); };
ACT.delFranja = d => { const { franjas } = readCfgForm(); franjas.splice(+d.i, 1); S.config.franjas = franjas; render(); toast('Franja quitada. Guardá la configuración.'); };
ACT.addFecha = d => {
  const inp = document.getElementById(d.k === 'fechasExtra' ? 'fx-add' : 'fq-add');
  if (!inp.value) return;
  if (!S.config[d.k].includes(inp.value)) S.config[d.k].push(inp.value);
  S.config[d.k].sort();
  audit(S, 'Configuración', `${d.k === 'fechasExtra' ? 'Fecha de guardia agregada' : 'Fecha de guardia quitada'}: ${F.fmt(inp.value)}`, { quien: S.config.quien });
  save(); render();
};
ACT.delFecha = d => {
  S.config[d.k] = S.config[d.k].filter(x => x !== d.d);
  audit(S, 'Configuración', `${d.k === 'fechasExtra' ? 'Se quitó la fecha agregada' : 'Se repuso la fecha'} ${F.fmt(d.d)}`, { quien: S.config.quien });
  save(); render();
};
ACT.saveCfg = () => {
  const { v, franjas } = readCfgForm();
  if (!v.quien) { toast('Indicá quién guarda la configuración.'); return; }
  if (!v.refDate) { toast('Falta la fecha de referencia.'); return; }
  const c = S.config;
  const antes = JSON.stringify({ base: c.base, refDate: c.refDate, ciclo: c.ciclo, regla: c.regla, semilla: c.semilla, franjas: c.franjas });
  Object.assign(c, { base: v.base || c.base, refDate: v.refDate, ciclo: Math.max(1, +v.ciclo || 3), regla: v.regla, semilla: +v.semilla || 1, franjas, quien: v.quien });
  const despues = JSON.stringify({ base: c.base, refDate: c.refDate, ciclo: c.ciclo, regla: c.regla, semilla: c.semilla, franjas: c.franjas });
  if (antes !== despues) audit(S, 'Configuración', `Regla: ${c.regla} · Referencia: ${F.fmt(c.refDate)} cada ${c.ciclo} días · Franjas: ${c.franjas.map(f => `${f.label} (${f.horas} h)`).join(', ')}`, { quien: v.quien });
  save(); render(); toast('Configuración guardada.');
};

/* ----- Respaldo ----- */
function downloadBackup() {
  S.config.ultimoRespaldo = TODAY();
  audit(S, 'Respaldo descargado', `nocturnas-guardiaA-${TODAY()}.json`, { quien: S.config.quien });
  save();
  const payload = { app: APP_ID, version: APP_VERSION, exportado: F.nowStamp(), data: S };
  const blob = new Blob([JSON.stringify(payload, null, 1)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `nocturnas-guardiaA-${TODAY()}.json`;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  renderBanner(); toast('Respaldo descargado.');
}
async function restoreBackup() {
  const file = await pickFile('.json,application/json');
  if (!file) return;
  let obj;
  try { obj = JSON.parse(await readFileText(file)); } catch (e) { alertDlg('Restaurar respaldo', '<p>El archivo no es un JSON válido.</p>'); return; }
  const err = validateBackup(obj);
  if (err) { alertDlg('Restaurar respaldo', `<p>${esc(err)}</p>`); return; }
  const d = obj.data || obj;
  const meses = Object.keys(d.meses).sort();
  const r = await openModal('Restaurar respaldo', `<p>Archivo: <b>${esc(file.name)}</b></p>
    <ul class="list-disc pl-5"><li>Fecha del respaldo: <b>${esc(obj.exportado ? obj.exportado.replace(/^(\d{4})-(\d\d)-(\d\d)/, '$3/$2/$1') : 'desconocida')}</b></li>
    <li>Personas: <b>${d.personal.length}</b> (${d.personal.filter(p => !p.baja).length} activas)</li>
    <li>Licencias/ausencias: <b>${d.ausencias.length}</b></li>
    <li>Meses: <b>${meses.length ? meses.map(F.mkLabel).join(', ') : 'ninguno'}</b></li>
    <li>Registros de historial: <b>${d.auditoria.length}</b></li></ul>
    <p class="text-red-700 font-semibold">⚠ Se reemplazan TODOS los datos actuales de este dispositivo.</p>${quienField()}`,
    [{ label: 'Cancelar' }, { label: 'Restaurar', value: 'ok', cls: C_DNG, validate: reqQuien }]);
  if (!r.value) return;
  S = migrate(d);
  audit(S, 'Respaldo restaurado', `${file.name} (${obj.exportado || 's/f'})`, { quien: r.vals.quien });
  S.config.quien = r.vals.quien;
  save(); render(); toast('Respaldo restaurado.');
}

/* ---------------- Eventos ---------------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.closest('#modal-root')) return;
  if (el.tagName === 'INPUT' && el.type === 'checkbox' && el.dataset.act !== 'verPasadas') e.preventDefault();
  const fn = ACT[el.dataset.act];
  if (fn) fn(el.dataset, el, e);
});
document.addEventListener('change', e => {
  const el = e.target.closest('[data-chg]'); if (!el) return;
  ui[el.dataset.chg] = el.value;
  if (el.dataset.chg === 'audFiltro') { render(); const i = document.querySelector('[data-chg=audFiltro]'); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } return; }
  render();
});
document.addEventListener('input', e => {
  if (e.target.matches('[data-chg=audFiltro]')) { clearTimeout(ui._t); ui._t = setTimeout(() => e.target.dispatchEvent(new Event('change', { bubbles: true })), 350); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && document.getElementById('preview-root').innerHTML) closePreview(); });
window.addEventListener('afterprint', () => { document.getElementById('print-root').innerHTML = ''; });

/* ---------------- Inicio ---------------- */
(function init() {
  const st = load();
  S = st ? migrate(st) : seedState();
  if (!st) save();
  const t = TODAY();
  ui.mk = F.mk(t);
  render();
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
})();

</script>
</body>
</html>
